# Development override — use with:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build
version: "3.9"

services:
  app:
    build:
      target: builder
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: development
